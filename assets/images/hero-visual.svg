<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Computing and chemistry: a molecular ring linked to a network graph</title>
  <defs>
    <linearGradient id="grad-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="grad-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f9d76"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="400" cy="280" r="260" fill="url(#glow)"/>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- ============ chemistry: aromatic ring ============ -->
    <!-- no fill: the card behind it is white in the light theme and dark in the
         dark theme, and an outline reads correctly on both -->
    <g filter="url(#soft-shadow)">
      <polygon points="360,300 305,395 195,395 140,300 195,205 305,205"
               fill="none"
               stroke="url(#grad-ring)" stroke-width="4"/>
      <circle cx="250" cy="300" r="62" fill="none"
              stroke="#0f9d76" stroke-width="3" stroke-opacity="0.55"/>
    </g>

    <!-- substituent bonds -->
    <g stroke="url(#grad-ring)" stroke-width="4">
      <line x1="360" y1="300" x2="432" y2="300"/>
      <line x1="195" y1="395" x2="195" y2="458"/>
      <line x1="195" y1="205" x2="195" y2="142"/>
    </g>
    <g fill="#0f9d76">
      <circle cx="195" cy="142" r="7"/>
      <circle cx="195" cy="458" r="7"/>
    </g>

    <!-- ============ bridge: dashed link between the two worlds ============ -->
    <path d="M 432 300 C 470 300 486 372 520 400"
          fill="none" stroke="url(#grad-edge)" stroke-width="3"
          stroke-dasharray="7 9" stroke-opacity="0.75"/>

    <!-- ============ computing: network graph ============ -->
    <g stroke="url(#grad-edge)" stroke-width="2.5" stroke-opacity="0.85">
      <line x1="520" y1="170" x2="640" y2="130"/>
      <line x1="640" y1="130" x2="710" y2="250"/>
      <line x1="710" y1="250" x2="650" y2="390"/>
      <line x1="650" y1="390" x2="520" y2="400"/>
      <line x1="520" y1="400" x2="600" y2="280"/>
      <line x1="600" y1="280" x2="520" y2="170"/>
      <line x1="520" y1="170" x2="710" y2="250"/>
      <line x1="600" y1="280" x2="650" y2="390"/>
    </g>
    <g fill="#2563eb">
      <circle cx="520" cy="170" r="10"/>
      <circle cx="640" cy="130" r="9"/>
      <circle cx="710" cy="250" r="10"/>
      <circle cx="650" cy="390" r="9"/>
      <circle cx="520" cy="400" r="10"/>
    </g>
    <circle cx="600" cy="280" r="13" fill="#0d9488"/>
    <circle cx="600" cy="280" r="20" fill="none" stroke="#0d9488" stroke-width="2" stroke-opacity="0.35"/>

    <!-- data points -->
    <g fill="#f59e0b" fill-opacity="0.75">
      <rect x="466" y="118" width="11" height="11" rx="2"/>
      <rect x="556" y="112" width="11" height="11" rx="2"/>
      <rect x="690" y="344" width="11" height="11" rx="2"/>
      <rect x="452" y="446" width="11" height="11" rx="2"/>
    </g>
  </g>

  <!-- labels -->
  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#64748b">
    <text x="140" y="522">chemistry</text>
    <text x="640" y="522">computing</text>
  </g>
</svg>
